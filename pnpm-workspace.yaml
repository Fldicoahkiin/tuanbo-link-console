packages:
  - apps/*
  - packages/*
allowBuilds:
  electron: true
  esbuild: true
  ffmpeg-static: true
overrides:
  'js-yaml': '4.3.2'
  'ws': '8.21.0'
  'vite': '7.3.5'
  'esbuild@>=0.27.3 <0.28.1': '0.28.1'
  'tar': '7.5.21'
  'tmp@<0.2.7': '0.2.7'
  '@xmldom/xmldom@<0.8.15': '0.8.15'
  'brace-expansion@1': '1.1.18'
  'brace-expansion@2': '2.1.4'
  'brace-expansion@5': '5.0.9'
  '@babel/core@7': '7.29.6'
  'baseline-browser-mapping@2': '2.11.0'
  'browserslist@4': '4.28.7'
  'form-data@4': '4.0.6'
  'nanoid@3': '3.3.18'
  'postcss@8': '8.5.23'
  # 运营后台的组件库（Base UI、Tailwind）会把这两个包带到更新的版本，pnpm 会让桌面端的 zustand、eslint、vite 跟着换；钉在桌面端原来用的版本上，后台的改动不动桌面端的依赖。
  'use-sync-external-store@1': '1.6.0'
  'jiti@2': '2.6.1'
patchedDependencies:
  'extract-zip@2.0.1': 'patches/extract-zip@2.0.1.patch'
