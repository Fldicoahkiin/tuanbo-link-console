name: Verify Desktop

# Desktop changes on master were otherwise only built when a release was packaged, half an hour into Release Windows.
# A push runs the cheap half on Linux: types, lint, a release bundle that packaging would refuse, and the unit tests
# (the few that need Windows skip themselves there), so a broken rule test (docs/LIGHTING_WORKFLOW.md) is seen minutes
# after the push.
#
# The whole suite on Windows takes about 26 minutes and a Windows minute counts double against the account's Actions
# minutes: in November 2026 running it on every push used the month's minutes up in two days. It now runs only when
# this workflow is started by hand, and in Release Windows before every release. Start it by hand before a release
# when a change touches what only runs on Windows (the tests marked skipIf(process.platform !== 'win32') and the
# modules under them: IBT, the OBS component install, system PowerShell, external processes).

on:
  push:
    branches: [master]
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'release-notes/**'
      - 'scripts/release-config.mjs'
      - 'scripts/release-notes.mjs'
      - 'scripts/verify-release-bundle.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'tsconfig*.json'
      - 'eslint.config.mjs'
      - '.github/workflows/verify-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6 (v6.0.10)
        with:
          version: 10.33.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7 (v7.1.0)
        with:
          node-version: 25.8.2
          cache: pnpm
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Release bundle has no local test access
        run: |
          pnpm --filter @tb/desktop exec electron-vite build --mode release
          node scripts/verify-release-bundle.mjs
      - name: Unit tests
        # `pnpm test` without tools/ibt/build.mjs, which only builds on Windows.
        run: |
          pnpm test:release
          pnpm exec vitest run

  test:
    # By hand only: see the note at the top.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6 (v6.0.10)
        with:
          version: 10.33.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7 (v7.1.0)
        with:
          node-version: 25.8.2
          cache: pnpm
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test
