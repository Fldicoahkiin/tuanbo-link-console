name: Verify Licensing Server

on:
  push:
    branches: [master]
    paths:
      - 'apps/licensing-server/**'
      - 'scripts/verify-purchase-website.mjs'
      - 'scripts/verify-product-website.mjs'
      - 'scripts/serve-product-website.mjs'
      - 'scripts/verify-console.mjs'
      - 'packages/core/**'
      - 'packages/schema/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'tsconfig*.json'
      - 'vitest.config.ts'
      - '.github/workflows/verify-licensing-server.yml'
  pull_request:
    paths:
      - 'apps/licensing-server/**'
      - 'scripts/verify-purchase-website.mjs'
      - 'scripts/verify-product-website.mjs'
      - 'scripts/serve-product-website.mjs'
      - 'scripts/verify-console.mjs'
      - 'packages/core/**'
      - 'packages/schema/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'tsconfig*.json'
      - 'vitest.config.ts'
      - '.github/workflows/verify-licensing-server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-licensing-server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.1
          cache: pnpm
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck licensing service
        run: pnpm --filter @tb/licensing-server typecheck
      - name: Verify authorization, payments and purchase client
        run: pnpm exec vitest run apps/licensing-server apps/desktop/src/main/link/purchase-service.test.ts --maxWorkers=2
      - name: Build server and website from this commit
        run: |
          pnpm --filter @tb/licensing-server build
          pnpm --filter @tb/licensing-server build:web
          pnpm --filter @tb/licensing-server build:console
      - name: Verify website checkout in an isolated browser
        run: |
          pnpm --filter @tb/desktop exec playwright install --with-deps chromium
          node scripts/verify-purchase-website.mjs
          node scripts/verify-product-website.mjs
          node scripts/verify-console.mjs
      - name: Verify deployment, rollback and delivery recovery
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -W error::ResourceWarning -m unittest discover -s apps/licensing-server/deploy -p 'test_*.py'
      - name: Record verification scope
        run: |
          printf 'Verified source: %s\n\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Built licensing service and website; verified isolated authorization, payment, deployment and recovery behavior.' 'Production deployment, when enabled, is reported below. These checks do not issue production licenses or execute real payments.' >> "$GITHUB_STEP_SUMMARY"
      - name: Confirm production branch is still current
        if: github.repository == 'JinHe9527/tuanbo-link-console' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && vars.TBLINK_AUTO_DEPLOY == 'true'
        id: deploy_source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipped deployment because this source has been superseded.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy verified licensing service and website
        if: steps.deploy_source.outputs.current == 'true'
        env:
          TBLINK_DEPLOY_SSH_KEY: ${{ secrets.TBLINK_DEPLOY_SSH_KEY }}
          TBLINK_DEPLOY_KNOWN_HOSTS: ${{ secrets.TBLINK_DEPLOY_KNOWN_HOSTS }}
        run: python3 apps/licensing-server/deploy/deploy-from-ci.py
