name: Release Windows

# Checks run on a GitHub-hosted runner. The installer is built, signed with the release key and uploaded to
# the server's staging area on the domestic self-hosted builder (labels release-builder): the beauty and
# music-analysis assets are not in git, and hosted runners lack the disk and the bandwidth to China.
# Nothing here publishes; the owner confirms the staged release in the console.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: '要检出的完整 Git SHA；必须与产物清单一致'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_sha || github.sha }}
          fetch-tags: true

      - name: Verify requested candidate commit
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if ($env:EXPECTED_SHA -cnotmatch '^[a-f0-9]{40}$') { throw 'Expected a full lowercase Git SHA' }
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:EXPECTED_SHA) { throw 'Checkout differs from the requested candidate commit' }

      - name: Use pnpm 10.33.0
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6 (v6.0.10)
        with:
          version: 10.33.0

      - name: Use Node.js 25.8.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7 (v7.1.0)
        with:
          node-version: 25.8.2
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Release version is new
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') { node scripts/verify-release-version.mjs --release "$env:GITHUB_REF_NAME" }
          else { node scripts/verify-release-version.mjs --release }
          if ($LASTEXITCODE -ne 0) { throw 'Release version check failed' }

      - name: Typecheck, test and lint
        run: |
          pnpm typecheck
          pnpm test
          pnpm lint

  build:
    needs: verify
    runs-on: [self-hosted, windows, release-builder]
    timeout-minutes: 150
    env:
      TBLINK_ASSETS: D:\tblink-release-assets
      TBLINK_RELEASE_UPLOAD_KEY: D:\tblink-release-signing\upload\tblink-release-ed25519
      TBLINK_RELEASE_KNOWN_HOSTS: D:\tblink-release-signing\upload\known_hosts
    steps:
      - name: Wait until no GUI test holds the shared machine
        shell: pwsh
        run: |
          # The builder is also the GUI test machine; sessions take C:\dev\claude-tools\locks\*.lock.
          $locks = 'C:\dev\claude-tools\locks'
          $deadline = (Get-Date).AddMinutes(60)
          while (Get-ChildItem -LiteralPath $locks -Filter *.lock) {
            if ((Get-Date) -gt $deadline) { throw "GUI 锁 60 分钟未释放：$((Get-ChildItem -LiteralPath $locks -Filter *.lock).Name -join ', ')" }
            Start-Sleep -Seconds 30
          }
          Set-Content -LiteralPath (Join-Path $locks 'release-builder.lock') -Value "Release Windows run $env:GITHUB_RUN_ID"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_sha || github.sha }}
          fetch-tags: true

      - name: Verify requested candidate commit
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:EXPECTED_SHA) { throw 'Checkout differs from the requested candidate commit' }

      # The runner's service account has no per-user Node; these install the pinned versions in its tool cache.
      # No GitHub cache: uploading it from China is slower than the local pnpm store.
      - name: Use pnpm 10.33.0
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6 (v6.0.10)
        with:
          version: 10.33.0

      - name: Use Node.js 25.8.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7 (v7.1.0)
        with:
          node-version: 25.8.2

      - name: Use the pinned beauty build
        shell: pwsh
        run: |
          # release-pin.json names the exact files; afterPack fails the build if the directory differs.
          $pin = Get-Content -Raw tools/obs/beauty/release-pin.json | ConvertFrom-Json
          $source = Join-Path $env:TBLINK_ASSETS ("beauty\" + $pin.outputs.sha256.Substring(0, 12))
          if (-not (Test-Path -LiteralPath $source -PathType Container)) { throw "构建机缺少固定版本的美颜产物：$source" }
          # A copy, not a junction: the next checkout's clean must never reach the read-only asset directory.
          robocopy $source artifacts\beauty-prototype /MIR /R:1 /W:1 /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 8) { throw "复制美颜产物失败：robocopy $LASTEXITCODE" }
          $global:LASTEXITCODE = 0

      - name: Use the pinned music-analysis runtime
        shell: pwsh
        run: |
          # release-pin.json fixes the runtime, models and licenses; afterPack fails the build if they differ.
          $pin = Get-Content -Raw tools/music-analysis/release-pin.json | ConvertFrom-Json
          $source = Join-Path $env:TBLINK_ASSETS ("music-analysis\" + $pin.outputs.sha256.Substring(0, 12))
          if (-not (Test-Path -LiteralPath $source -PathType Container)) { throw "构建机缺少固定版本的音乐分析运行时：$source" }
          robocopy $source artifacts\music-analysis /MIR /R:1 /W:1 /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 8) { throw "复制音乐分析运行时失败：robocopy $LASTEXITCODE" }
          $global:LASTEXITCODE = 0

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Package and check
        shell: pwsh
        run: |
          pnpm dist
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          node scripts/verify-desktop-artifacts.mjs --dist
          if ($LASTEXITCODE -ne 0) { throw 'Artifact checks failed' }

      - name: Sign latest.yml with the release key
        # The private key exists only in this step's environment; it is never written to disk.
        env:
          TBLINK_RELEASE_SIGNING_KEY: ${{ secrets.TBLINK_RELEASE_SIGNING_KEY }}
          TBLINK_RELEASE_SIGNING_KID: release-2026-10-a
        run: node scripts/sign-release.mjs

      - name: Record the release
        shell: pwsh
        run: |
          node scripts/write-release-manifest.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Release manifest failed' }
          $manifest = Get-Content -Raw apps/desktop/dist/release-manifest.json | ConvertFrom-Json
          if (-not $manifest.releaseSignature) { throw 'A release build must be signed' }

      - name: Upload to the server's staging area
        run: node scripts/upload-release.mjs

      - name: Keep the release manifest with this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 (v7.0.2)
        with:
          name: release-manifest-${{ inputs.expected_sha || github.sha }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          path: |
            apps/desktop/dist/release-manifest.json
            apps/desktop/dist/latest.yml

      - name: Release the shared machine
        if: always()
        shell: pwsh
        run: |
          $lock = 'C:\dev\claude-tools\locks\release-builder.lock'
          if (Test-Path -LiteralPath $lock) { Remove-Item -LiteralPath $lock }
