name: Release Windows

# A release starts one of two ways, and nothing after it needs a person:
#   - Run this workflow by hand (or through the API) on master or a release/* branch with the commit to release. The
#     tag job checks that the branch is still on that commit and tags it vX.Y.Z through the GitHub API
#     (scripts/tag-release.mjs). This is how Claude releases: its sessions cannot push tags. A tag whose version was never
#     released moves to the new commit, so a release that failed before publishing keeps its version number.
#   - Push a vX.Y.Z tag.
#   tag     dispatched runs only, see above.
#   verify  GitHub-hosted: version, typecheck, tests, lint.
#   build   GitHub-hosted: fetches the pinned beauty and music-analysis assets from their own releases, packages,
#           signs latest.yml with the release key (secret) and puts the four files into a draft release on the tag.
#           No Actions artifacts: a private repository has only 500 MB of artifact storage.
# The server's upload key never goes to GitHub. scripts/relay-release.mjs carries the draft to the server and publishes
# it once the feed serves it: the office PC runs it every 10 minutes, and a Mac can run it by hand (pnpm release:relay).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      commit:
        description: 要发布的提交（完整 40 位提交号，必须是所选分支的最新提交）
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-windows-${{ inputs.commit || github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Creates or moves the release tag.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use pnpm 10.33.0
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6 (v6.0.10)
        with:
          version: 10.33.0

      - name: Use Node.js 25.8.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7 (v7.1.0)
        with:
          node-version: 25.8.2
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Tag the commit to release
        id: tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: node scripts/tag-release.mjs "$RELEASE_COMMIT"

  verify:
    needs: tag
    # A tag push skips the tag job; a dispatched run continues only once its tag exists.
    if: ${{ !cancelled() && (needs.tag.result == 'success' || (needs.tag.result == 'skipped' && github.event_name == 'push')) }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ needs.tag.outputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
        with:
          persist-credentials: false
          fetch-tags: true

      - name: Use pnpm 10.33.0
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6 (v6.0.10)
        with:
          version: 10.33.0

      - name: Use Node.js 25.8.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7 (v7.1.0)
        with:
          node-version: 25.8.2
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Release version is new
        shell: pwsh
        run: |
          node scripts/verify-release-version.mjs --release "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Release version check failed' }

      - name: Typecheck, test and lint
        run: |
          pnpm typecheck
          pnpm test
          pnpm lint

  build:
    needs: [tag, verify]
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ needs.tag.outputs.tag || github.ref_name }}
    # Creates and fills the draft release.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
        with:
          persist-credentials: false
          fetch-tags: true

      - name: Use pnpm 10.33.0
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6 (v6.0.10)
        with:
          version: 10.33.0

      - name: Use Node.js 25.8.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7 (v7.1.0)
        with:
          node-version: 25.8.2
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Release version is still new
        # Checked again here: a re-run of this job alone must not rebuild a version the feed already serves.
        shell: pwsh
        run: |
          node scripts/verify-release-version.mjs --release "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Release version check failed' }

      - name: Fetch the pinned beauty build and music-analysis runtime
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/build-assets.mjs fetch beauty
          if ($LASTEXITCODE -ne 0) { throw 'Beauty assets failed' }
          node scripts/build-assets.mjs fetch music-analysis
          if ($LASTEXITCODE -ne 0) { throw 'Music-analysis assets failed' }

      - name: Package and check
        shell: pwsh
        run: |
          pnpm dist
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          node scripts/verify-desktop-artifacts.mjs --dist
          if ($LASTEXITCODE -ne 0) { throw 'Artifact checks failed' }

      - name: Sign latest.yml with the release key
        # The private key exists only in this step's environment; it is never written to disk.
        env:
          TBLINK_RELEASE_SIGNING_KEY: ${{ secrets.TBLINK_RELEASE_SIGNING_KEY }}
          TBLINK_RELEASE_SIGNING_KID: release-2026-10-a
        run: node scripts/sign-release.mjs

      - name: Record the release
        shell: pwsh
        run: |
          node scripts/write-release-manifest.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Release manifest failed' }
          $manifest = Get-Content -Raw apps/desktop/dist/release-manifest.json | ConvertFrom-Json
          if (-not $manifest.releaseSignature) { throw 'A release build must be signed' }

      - name: Put the release into a draft GitHub release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/draft-github-release.mjs ($env:RELEASE_TAG.Substring(1)) apps/desktop/dist
          if ($LASTEXITCODE -ne 0) { throw 'Draft release failed' }

