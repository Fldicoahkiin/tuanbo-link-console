name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: '要检出的完整 Git SHA；必须与产物清单一致'
        required: true
        type: string
      archive_to_draft:
        description: '直接归档到版本标签的草稿 Release，不占用 Actions artifact 配额；不发布正式版'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      candidate-name: windows-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_sha || github.sha }}
          fetch-tags: true

      - name: Verify requested candidate commit
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if ($env:EXPECTED_SHA -cnotmatch '^[a-f0-9]{40}$') { throw 'Expected a full lowercase Git SHA' }
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:EXPECTED_SHA) {
            throw 'Checkout differs from the requested candidate commit'
          }

      - name: Use pnpm 10.33.0
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Use Node.js 25.8.2
        uses: actions/setup-node@v7
        with:
          node-version: 25.8.2
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version and tag
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            node scripts/verify-release-version.mjs --release "$env:GITHUB_REF_NAME"
          } else {
            node scripts/verify-release-version.mjs --release
          }

      - name: Verify and build Windows release
        run: pnpm verify:release

      - name: Archive verified Windows candidate
        if: ${{ !inputs.archive_to_draft }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-candidate-${{ inputs.expected_sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            apps/desktop/dist/Tuanbo-Link-Console-*.exe
            apps/desktop/dist/Tuanbo-Link-Console-*.exe.blockmap
            apps/desktop/dist/latest.yml
            apps/desktop/dist/release-manifest.json

      - name: Archive candidate directly to draft release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.archive_to_draft }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $manifest = Get-Content apps/desktop/dist/release-manifest.json -Raw | ConvertFrom-Json
          $tag = "v$($manifest.version)"
          $tagSha = (gh api "repos/$env:GH_REPO/commits/$tag" --jq .sha).Trim()
          if ($LASTEXITCODE -ne 0 -or $tagSha -cne $manifest.gitSha) { throw 'Release tag differs from manifest' }
          $installer = "apps/desktop/dist/Tuanbo-Link-Console-$($manifest.version)-x64.exe"
          $notes = "Verified Windows candidate. Source: $($manifest.gitSha). Build: https://github.com/$env:GH_REPO/actions/runs/$env:GITHUB_RUN_ID. Not a published release."
          gh release create $tag --verify-tag --draft --title "团播联动台 $($manifest.version)" --notes $notes $installer "${installer}.blockmap" apps/desktop/dist/latest.yml apps/desktop/dist/release-manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Draft release archive failed; inspect existing assets before retrying' }

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download this run's verified candidate
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.release-windows.outputs.candidate-name }}
          path: apps/desktop/dist

      - name: Upload draft candidate assets
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          make_latest: 'false'
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            apps/desktop/dist/Tuanbo-Link-Console-*.exe
            apps/desktop/dist/Tuanbo-Link-Console-*.exe.blockmap
            apps/desktop/dist/latest.yml
            apps/desktop/dist/release-manifest.json
