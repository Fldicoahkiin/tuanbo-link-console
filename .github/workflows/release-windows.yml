name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: '完整 Git SHA；仅构建 Windows 候选包，不创建 Release 或更新线上 feed'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      candidate-name: windows-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify requested candidate commit
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if ($env:EXPECTED_SHA -cnotmatch '^[a-f0-9]{40}$') { throw 'Expected a full lowercase Git SHA' }
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:EXPECTED_SHA -or $actual -cne $env:GITHUB_SHA) {
            throw 'Checkout differs from the requested candidate commit'
          }

      - name: Use pnpm 10.33.0
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Use Node.js 25.8.2
        uses: actions/setup-node@v7
        with:
          node-version: 25.8.2
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version and tag
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            node scripts/verify-release-version.mjs "$env:GITHUB_REF_NAME"
          } else {
            node scripts/verify-release-version.mjs
          }

      - name: Verify and build Windows release
        run: pnpm verify:release

      - name: Archive verified Windows candidate
        uses: actions/upload-artifact@v7
        with:
          name: windows-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            apps/desktop/dist/Tuanbo-Link-Console-*.exe
            apps/desktop/dist/Tuanbo-Link-Console-*.exe.blockmap
            apps/desktop/dist/latest.yml
            apps/desktop/dist/release-manifest.json

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download this run's verified candidate
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.release-windows.outputs.candidate-name }}
          path: apps/desktop/dist

      - name: Upload draft candidate assets
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          make_latest: 'false'
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            apps/desktop/dist/Tuanbo-Link-Console-*.exe
            apps/desktop/dist/Tuanbo-Link-Console-*.exe.blockmap
            apps/desktop/dist/latest.yml
            apps/desktop/dist/release-manifest.json
