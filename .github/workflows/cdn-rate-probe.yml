name: CDN rate limit probe

# One-off check that the update CDN no longer answers 514 to a burst of Range requests.
# Runs only on pushes to this working branch; removed again right after.
on:
  push:
    branches: [claude/project-thread-bgi1y0]
    paths: ['.github/workflows/cdn-rate-probe.yml']

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Burst of Range requests
        shell: python
        run: |
          import collections, concurrent.futures, time, urllib.request
          base = "https://updates.tuanbo-link.jinhefilm.com/windows/x64"
          exe = f"{base}/Tuanbo-Link-Console-0.5.9-x64.exe"
          with urllib.request.urlopen(f"{base}/latest.yml", timeout=20) as r:
              print("latest.yml", r.status, r.read().decode().splitlines()[0])

          def get(i):
              start = i * 1048576
              req = urllib.request.Request(exe, headers={"Range": f"bytes={start}-{start + 40959}"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, len(r.read())
              except urllib.error.HTTPError as e:
                  return e.code, 0

          for label, count in (("burst 60", 60), ("burst 120", 120)):
              t = time.time()
              with concurrent.futures.ThreadPoolExecutor(count) as pool:
                  results = list(pool.map(get, range(count)))
              took = time.time() - t
              codes = collections.Counter(code for code, _ in results)
              sizes = collections.Counter(size for code, size in results if code == 206)
              print(f"{label}: {dict(codes)} in {took:.2f}s ({count / took:.0f}/s), 206 sizes {dict(sizes)}")
              time.sleep(3)
