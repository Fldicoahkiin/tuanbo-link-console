Match User tblink-deploy
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication yes
    AuthorizedKeysFile /etc/tblink-deploy/authorized_keys
    ForceCommand /usr/bin/sudo -n /usr/bin/python3 /usr/local/libexec/tblink-receive-release.py
    DisableForwarding yes
    PermitTTY no
    X11Forwarding no
    PermitUserRC no
Match all
