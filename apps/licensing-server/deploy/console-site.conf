# Install as a separate Nginx site after issuing a certificate for this hostname.
server {
    listen 80;
    listen [::]:80;
    server_name admin.tuanbo-link.jinhefilm.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/tblink-acme; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.tuanbo-link.jinhefilm.com;
    ssl_certificate /etc/letsencrypt/live/admin.tuanbo-link.jinhefilm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.tuanbo-link.jinhefilm.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/tblink-console;
    client_max_body_size 16k;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    location = / { limit_except GET { deny all; } try_files /index.html =404; }
    location = /console.js { limit_except GET { deny all; } try_files $uri =404; }
    location = /console.css { limit_except GET { deny all; } try_files $uri =404; }
    location ^~ /console-api/ {
        if (-f /srv/tblink-console-maintenance) { return 503; }
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host admin.tuanbo-link.jinhefilm.com;
        proxy_set_header X-Tblink-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
    # The old Bearer admin API must never be exposed here.
    location / { return 404; }
}
