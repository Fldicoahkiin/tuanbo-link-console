# Load inside Nginx http context (sites-enabled). Existing sites remain separate.
# Enable HTTPS blocks only after webroot certificate issuance succeeds.
limit_req_zone $binary_remote_addr zone=tblink_activation:1m rate=30r/m;
# In-app problem reports: a report and its diagnostic package are two requests.
limit_req_zone $binary_remote_addr zone=tblink_feedback:1m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name api.tuanbo-link.jinhefilm.com updates.tuanbo-link.jinhefilm.com tuanbo-link.jinhefilm.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/tblink-acme; }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.tuanbo-link.jinhefilm.com;
    ssl_certificate /etc/letsencrypt/live/tuanbo-link.jinhefilm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tuanbo-link.jinhefilm.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    location = /health {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_read_timeout 15s;
        proxy_set_header X-Tblink-Client-IP $remote_addr;
    }
    location = /v1/activate {
        limit_except POST { deny all; }
        limit_req zone=tblink_activation burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Tblink-Client-IP $remote_addr;
    }
    # Prices and payment configuration must be approved before enabling sales.
    location = /v1/catalog {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Tblink-Client-IP $remote_addr;
    }
    location = /v1/orders {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Tblink-Client-IP $remote_addr;
    }
    # Customers need a dedicated delivery credential; admin routes remain private.
    location ~ "^/v1/orders/[a-f0-9-]{36}$" {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Tblink-Client-IP $remote_addr;
    }
    location ~ "^/v1/orders/[a-f0-9-]{36}/reconcile$" {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Tblink-Client-IP $remote_addr;
    }
    # Service returns 404 unless all Alipay identity/key settings are configured.
    location = /v1/payments/alipay/notify {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Tblink-Client-IP $remote_addr;
    }
    location = /v1/payments/wechat/notify {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Tblink-Client-IP $remote_addr;
    }
    # In-app problem reports. The service answers 404 FEEDBACK_DISABLED until FEEDBACK_DIRECTORY is set.
    location = /v1/feedback {
        limit_except POST { deny all; }
        limit_req zone=tblink_feedback burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Tblink-Client-IP $remote_addr;
    }
    # The report's diagnostic package (8 MiB at most). Nginx takes the whole body first, so the service's
    # 10 s request limit only covers the local hop; a slow venue uplink has client_body_timeout between reads.
    location ~ "^/v1/feedback/[a-f0-9-]{36}/diagnostic$" {
        limit_except PUT { deny all; }
        limit_req zone=tblink_feedback burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 9m;
        client_body_timeout 60s;
        proxy_request_buffering on;
        proxy_pass http://127.0.0.1:8787;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Tblink-Client-IP $remote_addr;
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name updates.tuanbo-link.jinhefilm.com;
    ssl_certificate /etc/letsencrypt/live/tuanbo-link.jinhefilm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tuanbo-link.jinhefilm.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/tblink-updates;
    add_header X-Content-Type-Options nosniff always;
    location = /windows/x64/latest.yml {
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location ~ ^/windows/x64/Tuanbo-Link-Console-[0-9]+\.[0-9]+\.[0-9]+-x64\.exe(\.blockmap)?$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tuanbo-link.jinhefilm.com;
    ssl_certificate /etc/letsencrypt/live/tuanbo-link.jinhefilm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tuanbo-link.jinhefilm.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / { return 404; }
}
