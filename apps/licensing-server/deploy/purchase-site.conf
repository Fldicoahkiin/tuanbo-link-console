    location = /media/20261010-overview.mp4 {
        limit_except GET { deny all; }
        try_files /media/20261010-overview.mp4 =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; media-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }
    location = /media/20261010-overview.vtt {
        types { text/vtt vtt; }
        limit_except GET { deny all; }
        try_files /media/20261010-overview.vtt =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; media-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }
    location = /v1/catalog {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Tblink-Client-IP $remote_addr;
    }
    location = /v1/orders {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Tblink-Client-IP $remote_addr;
    }
    location ~ "^/v1/orders/[a-f0-9-]{36}$" {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Tblink-Client-IP $remote_addr;
