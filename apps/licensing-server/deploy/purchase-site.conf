# Prepared configuration only. Replace the existing tuanbo-link.jinhefilm.com
# HTTPS placeholder block after reviewing legal copy and publishing dist/web.
# Do not include both blocks with the same server_name; leave API/updates sites intact.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tuanbo-link.jinhefilm.com;
    ssl_certificate /etc/letsencrypt/live/tuanbo-link.jinhefilm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tuanbo-link.jinhefilm.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/tblink-purchase;
    client_max_body_size 16k;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; media-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    location = / {
        limit_except GET { deny all; }
        try_files /index.html =404;
    }
    location = /purchase.js {
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    location = /purchase.css {
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    # Publish only approved demo videos here; byte-range playback is served by Nginx.
    location ~ "^/media/[a-z0-9][a-z0-9-]*\.mp4$" {
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    location = /v1/catalog {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Tblink-Client-IP $remote_addr;
    }
    location = /v1/orders {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Tblink-Client-IP $remote_addr;
    }
    location ~ "^/v1/orders/[a-f0-9-]{36}$" {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Tblink-Client-IP $remote_addr;
    }
    location / { return 404; }
}
