# Prepared configuration only. Replace the existing tuanbo-link.jinhefilm.com
# HTTPS placeholder block after reviewing legal copy and publishing dist/web.
# Do not include both blocks with the same server_name; leave API/updates sites intact.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tuanbo-link.jinhefilm.com;
    ssl_certificate /etc/letsencrypt/live/tuanbo-link.jinhefilm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tuanbo-link.jinhefilm.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/tblink-purchase;
    client_max_body_size 16k;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; media-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    location = / {
        limit_except GET { deny all; }
        try_files /index.html =404;
    }
    location = /purchase.js {
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    location = /purchase.css {
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    location = /assets/studio.webp {
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    location = /assets/display.woff2 {
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    location = /assets/FONT-LICENSE.txt {
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    # Publish only approved demo videos here; byte-range playback is served by Nginx.
    location ~ "^/media/[a-z0-9][a-z0-9-]*\.mp4$" {
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    location = /site.js {
        limit_except GET { deny all; }
        try_files /site.js =404;
    }
    location = /site.css {
        limit_except GET { deny all; }
        try_files /site.css =404;
    }
    location = /download/ {
        limit_except GET { deny all; }
        try_files /download/index.html =404;
    }
    location = /guide/ {
        limit_except GET { deny all; }
        try_files /guide/index.html =404;
    }
    location = /purchase/ {
        limit_except GET { deny all; }
        try_files /purchase/index.html =404;
    }
    location = /media.json {
        limit_except GET { deny all; }
        try_files /media.json =404;
    }
    location = /release.json {
        limit_except GET { deny all; }
        try_files /release.json =404;
    }
    location = /robots.txt {
        limit_except GET { deny all; }
        try_files /robots.txt =404;
    }
    location = /sitemap.xml {
        limit_except GET { deny all; }
        try_files /sitemap.xml =404;
    }
    location = /website-manifest.json {
        limit_except GET { deny all; }
        try_files /website-manifest.json =404;
    }
    location = /assets/20261010-programs.webp {
        limit_except GET { deny all; }
        try_files /assets/20261010-programs.webp =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; media-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }
    location = /assets/20261010-timeline.webp {
        limit_except GET { deny all; }
        try_files /assets/20261010-timeline.webp =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
