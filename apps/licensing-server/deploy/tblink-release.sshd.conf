Match User tblink-release
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication yes
    AuthorizedKeysFile /etc/tblink-release/authorized_keys
    ForceCommand /usr/bin/python3 /usr/local/libexec/tblink-receive-update.py
    DisableForwarding yes
    PermitTTY no
    X11Forwarding no
    PermitUserRC no
Match all
